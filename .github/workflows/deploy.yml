name: deploy-book

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  deploy-book:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: pip install markdown==3.10 pygments==2.19.2

    - name: Generate notes metadata
      run: python .claude/skills/md2html/gen_notes_meta.py

    - name: Convert Markdown to HTML
      run: python .claude/skills/md2html/md2html.py

    - name: Deploy to GitHub Pages
      if: github.ref == 'refs/heads/main'
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./docs
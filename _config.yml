# Book settings
title: 我的学习笔记
author: [floaritay]
logo: logo.png  # Optional

# Execution settings
execute:
  execute_notebooks: false  # Since content is for display only

# HTML settings
html:
  use_issues_button: true
  use_repository_button: true
  use_edit_page_button: true
  baseurl: ''  # Update with actual GitHub Pages URL

# LaTeX settings (optional)
latex:
  latex_documents:
    targetname: book.tex

# Repository information
repository:
  url: https://github.com/floaritay/floaritay.github.io  # Update with actual repo URL
  path_to_book: ""  # Path to the book in the repository
  branch: main  # Branch to link to